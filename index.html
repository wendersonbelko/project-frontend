<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* Remove margin/padding e box‑sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* Firefox */
      scrollbar-width: thin;
      scrollbar-color: #2f855a #343541;
    }

    /* Full height e controla overflow: só horizontal escondido */
    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      overflow-x: hidden;  /* evita scroll horizontal */
      overflow-y: auto;    /* permite scroll vertical */
    }

    /* Fonte, background e cor padrão */
    body {
      font-family: Poppins, sans-serif;
      background-color: #202123;
      color: #ffffff;
    }

    /* Reset listas e links */
    ul, ol { list-style: none; }
    a { text-decoration: none; color: inherit; }

    /* Scroll personalizado WebKit */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #343541;               /* colorBgContainer */
    }
    ::-webkit-scrollbar-thumb {
      background-color: #2f855a;         /* colorPrimary */
      border-radius: 6px;                /* borderRadius */
      border: 2px solid #3e3f4b;         /* colorBgElevated */
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: #48bb78;         /* colorSuccess */
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
